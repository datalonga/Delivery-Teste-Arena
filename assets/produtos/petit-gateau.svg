<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Petit gâteau de chocolate com sorvete de baunilha e frutas vermelhas">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0" stop-color="#3b2c25"/>
      <stop offset="0.55" stop-color="#211a16"/>
      <stop offset="1" stop-color="#0f0b09"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf5"/>
      <stop offset="0.55" stop-color="#ece4da"/>
      <stop offset="1" stop-color="#bfb3a4"/>
    </linearGradient>
    <linearGradient id="cakeTop" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6b4028"/>
      <stop offset="0.5" stop-color="#4a2716"/>
      <stop offset="1" stop-color="#2f180c"/>
    </linearGradient>
    <linearGradient id="cakeSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1008"/>
      <stop offset="0.18" stop-color="#3f2213"/>
      <stop offset="0.45" stop-color="#5c3320"/>
      <stop offset="0.72" stop-color="#432515"/>
      <stop offset="1" stop-color="#1c0e07"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2413"/>
      <stop offset="0.45" stop-color="#31170c"/>
      <stop offset="1" stop-color="#180a05"/>
    </linearGradient>
    <radialGradient id="cream" cx="36%" cy="28%" r="74%">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="0.55" stop-color="#f8efdc"/>
      <stop offset="1" stop-color="#d9c8aa"/>
    </radialGradient>
    <radialGradient id="berry" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#e35568"/>
      <stop offset="0.6" stop-color="#b52138"/>
      <stop offset="1" stop-color="#7a1122"/>
    </radialGradient>
    <filter id="soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g fill="#ffd7a3" opacity="0.13" filter="url(#soft)">
    <circle cx="152" cy="150" r="58"/><circle cx="880" cy="120" r="70"/><circle cx="946" cy="470" r="42"/>
    <circle cx="84" cy="470" r="44"/><circle cx="300" cy="72" r="24"/><circle cx="700" cy="70" r="30"/>
  </g>

  <g id="subject" transform="translate(512 512) scale(1.24) translate(-512 -512)">
    <ellipse cx="512" cy="286" rx="340" ry="240" fill="#ffb27a" opacity="0.1" filter="url(#soft)"/>

    <!-- prato -->
    <ellipse cx="512" cy="712" rx="372" ry="158" fill="#000000" opacity="0.55" filter="url(#soft)"/>
    <ellipse cx="512" cy="700" rx="366" ry="152" fill="url(#plate)"/>
    <ellipse cx="512" cy="694" rx="330" ry="130" fill="#fdfbf7"/>
    <ellipse cx="512" cy="694" rx="330" ry="130" fill="none" stroke="#d6cabb" stroke-width="4"/>
    <ellipse cx="512" cy="684" rx="262" ry="98" fill="#ffffff" opacity="0.6"/>
    <path d="M232 636c74 74 300 108 470 62" stroke="#e7ddd1" stroke-width="7" fill="none" opacity="0.8"/>

    <!-- calda no prato -->
    <ellipse cx="548" cy="672" rx="212" ry="58" fill="url(#lava)" opacity="0.6"/>
    <path d="M336 654c82 58 296 76 404 22 26 26-58 66-198 66s-232-40-206-88z" fill="url(#lava)" opacity="0.5"/>

    <!-- bolo -->
    <g>
      <path d="M404 452h240v190c0 46-56 78-120 78s-120-32-120-78z" fill="url(#cakeSide)"/>
      <ellipse cx="524" cy="452" rx="120" ry="36" fill="url(#cakeTop)"/>
      <ellipse cx="524" cy="450" rx="92" ry="26" fill="#3a1f12"/>
      <ellipse cx="524" cy="452" rx="78" ry="21" fill="#1e0f08"/>

      <!-- lava escorrendo -->
      <path d="M524 474c22 0 38 10 38 24 0 26-8 42-14 68-8 34 16 52 4 70-13 20-54 24-74 6-18-17 2-38-4-70-6-30-24-42-24-70 0-19 30-28 74-28z" fill="url(#lava)"/>
      <path d="M518 488c16 0 26 8 26 18 0 20-8 32-12 52" stroke="#8a4d2b" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
      <path d="M556 560c10 16 6 30-2 44" stroke="#6b3a20" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>

      <!-- luz lateral direita -->
      <path d="M644 470v168c0 18-8 32-22 42 26-24 34-44 34-58V462z" fill="#ffb27a" opacity="0.16"/>
      <g fill="#a86440" opacity="0.5">
        <circle cx="452" cy="446" r="5"/><circle cx="484" cy="432" r="3.5"/><circle cx="506" cy="440" r="4"/>
        <circle cx="590" cy="442" r="4.5"/><circle cx="566" cy="430" r="3"/><circle cx="540" cy="424" r="4"/>
        <circle cx="432" cy="512" r="3"/><circle cx="624" cy="528" r="3.5"/><circle cx="596" cy="600" r="3"/>
      </g>
    </g>

    <!-- sorvete -->
    <g>
      <ellipse cx="300" cy="656" rx="96" ry="26" fill="#000000" opacity="0.35" filter="url(#soft)"/>
      <path d="M204 640a96 96 0 0 1 192 0v10a96 48 0 0 1-192 0z" fill="url(#cream)"/>
      <circle cx="300" cy="626" r="96" fill="url(#cream)"/>
      <path d="M238 592c20-24 60-36 94-24" stroke="#ffffff" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M282 716c-10 22-8 40 4 54" stroke="#f4e8d1" stroke-width="17" stroke-linecap="round" fill="none"/>
      <path d="M330 712c6 18 4 32-4 44" stroke="#f4e8d1" stroke-width="12" stroke-linecap="round" fill="none"/>
      <circle cx="340" cy="664" r="6" fill="#e6d5b7" opacity="0.9"/>
      <circle cx="268" cy="672" r="4.5" fill="#e6d5b7" opacity="0.9"/>
      <circle cx="312" cy="590" r="4" fill="#ffffff" opacity="0.7"/>
    </g>

    <!-- frutas -->
    <g>
      <circle cx="736" cy="628" r="40" fill="url(#berry)"/>
      <circle cx="716" cy="610" r="12" fill="#e86074" opacity="0.7"/>
      <circle cx="752" cy="642" r="9" fill="#78101f" opacity="0.8"/>
      <circle cx="776" cy="676" r="30" fill="url(#berry)"/>
      <circle cx="766" cy="664" r="8" fill="#e86074" opacity="0.7"/>
      <path d="M694 660c-16-10-32-8-44 4 14 10 30 10 44-4z" fill="#2e7d4f"/>
      <path d="M668 644c-4-16 3-27 16-33 5 13 0 26-16 33z" fill="#3b9a61"/>
      <circle cx="700" cy="676" r="26" fill="#a51f34" opacity="0.9"/>
    </g>
  </g>
</svg>
